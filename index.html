function jualKend(db, id) { const i = (db.kendaraan || []).findIndex(v => v.id === id); if (i < 0) return { ok: false, msg: 'Kendaraan tidak ditemukan.' }; const v = db.kendaraan[i]; if ((db.pajak || []).some(t => t.obj === id && t.status !== 'Lunas')) return { ok: false, msg: 'Lunasi dulu tagihan pajak kendaraan ini.' }; const back = Math.round(v.harga * .6); credit(db, v.akun, back, 'Jual ' + KEND[v.jenis].n, 'Kendaraan'); db.kendaraan.splice(i, 1); log(db, v.pemilik, `Menjual ${KEND[v.jenis].n} (${v.plat})`); return { ok: true, back }; }

/* ---------- TUGAS WARGA ---------- */
L.tugasNew = (db, off, s) => {

L.pengumuman = (db, U, judul, isi) => { if (!judul || !isi) return fail('Judul dan isi wajib diisi.'); db.pengumuman.push({ id: uid('pg'), judul: judul.slice(0, 100), isi: isi.slice(0, 500), oleh: L.actor(U), ts: Date.now() }); notify(db, 'w:*', '📢 ' + judul, isi.slice(0, 140), 'warn'); log(db, L.actor(U), 'Pengumuman: ' + judul); return { ok: true }; };
L.kepala = (db, U, bId, wid, copot) => {
  const b = db.buildings.find(x => x.id === bId); if (!b || !F.JABT[b.tipe]) return fail('Bangunan ini tidak punya jabatan pimpinan.');

function insForm(pre) {

  const m = form('Instruksi Baru', [{ k: 'tpl', l: 'Template contoh (opsional)', t: 'select', o: [['', '— tulis sendiri —']].concat(L.insTemplates.map((t, i) => [i, t.j])) }, { k: 'judul', l: 'Judul', req: 1 }, { k: 'isi', l: 'Isi instruksi', t: 'textarea', req: 1 }, { k: 'pen', l: 'Penerima', t: 'select', o: rec }, { k: 'anggaran', l: 'Anggaran dari Dana Pembangunan (Rp)', t: 'number', v: 0, min: 0 }, { k: 'pri', l: 'Prioritas', t: 'select', v: 'Sedang', o: ['Rendah', 'Sedang', 'Tinggi', 'Darurat'].map(x => [x, x]) }, { k: 'menit', l: 'Tenggat (menit dari sekarang)', t: 'number', v: 60, min: 1, max: 100000 }, { k: 'terbit', l: 'Penerbitan', t: 'checkbox', v: true, ph: 'Langsung terbitkan (kalau tidak: simpan sebagai draft)' }], v => {
    const [tp, id] = v.pen === 'vp' ? ['vp', null] : v.pen.split(':'); const r = run((d, u) => L.insNew(d, u, { judul: v.judul, isi: v.isi, penerima: { tipe: tp, id }, anggaran: v.anggaran, prioritas: v.pri, tenggat: Date.now() + v.menit * 60000, terbit: v.terbit, target: tgt }), v.terbit ? 'Instruksi diterbitkan & diterima pejabat.' : 'Draft disimpan.'); if (!r) return false; render();
  });
  const _pre = () => { if (!pre) return; if (pre.pen) m.querySelector('[name=pen]').value = pre.pen; if (pre.tpl != null) { const t = m.querySelector('[name=tpl]'); t.value = pre.tpl; t.dispatchEvent(new Event('change')); if (pre.pen) m.querySelector('[name=pen]').value = pre.pen; } if (pre.pri) m.querySelector('[name=pri]').value = pre.pri; };
  m.querySelector('[name=tpl]').onchange = e => { if (e.target.value === '') { tgt = null; return; } const t = L.insTemplates[+e.target.value]; tgt = t.t; m.querySelector('[name=judul]').value = t.j; m.querySelector('[name=isi]').value = t.i + (t.t ? ` (Target: ${t.t.jumlah} ${BT[t.t.tipe].n} — progres otomatis saat pejabat membangun.)` : ''); m.querySelector('[name=anggaran]').value = t.a; m.querySelector('[name=pen]').value = 'kem:' + t.k; };
}

V.fitur = db => {

};
actions.fx = d => { const f = fxList[+d.i]; if (f) f.f(); };

function render() {
  const db = get(); if (!ROLE) { loginView(db); return; } shell(db); $('#main').innerHTML = (V[view] || V.dash)(db); after(db);
  if (view === 'fitur') { const q = $('#fxQ'), g = $('#fxG'), flt = () => { fxQ = q.value; fxG = g.value; const s2 = fxQ.toLowerCase(); let n = 0; $$('#fxGrid .fxc').forEach(c => { const ok = (!fxG || c.dataset.g === fxG) && (!s2 || c.dataset.s.includes(s2)); c.style.display = ok ? '' : 'none'; if (ok) n++; }); $('#fxN').textContent = n + ' ditampilkan'; }; q.oninput = flt; g.onchange = flt; if (fxQ || fxG) flt(); }
}
function softRender() {

}
